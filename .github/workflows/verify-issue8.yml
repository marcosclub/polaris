name: Verificación aislada del issue 8
on:
  push:
    branches: [codex/verify-issue8]
permissions:
  contents: read
jobs:
  public-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dependencias de pruebas públicas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr
          python3 -m venv /tmp/pipeline-test-venv
          /tmp/pipeline-test-venv/bin/python -m pip install pysam==0.24.0 PyYAML==6.0.3
      - name: Batería pública sin configuración privada
        run: BTP_PORTABLE=1 bash tests/test_all.sh
      - name: Batería específica del pipeline
        if: always()
        run: /tmp/pipeline-test-venv/bin/python pipeline/bin/test_alelos_muestra.py
      - name: Barrido y sintaxis
        if: always()
        run: |
          python3 tools/ci_barrido.py pipeline/bin/muestras.py pipeline/bin/test_alelos_muestra.py
          python3 tools/ci_barrido.py --selftest
          python3 -m compileall -q tools tests pipeline evals
